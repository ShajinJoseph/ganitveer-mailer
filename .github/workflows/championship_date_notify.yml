name: GanitVeer Championship Date Update

# ONE-TIME manual workflow for the Season 1 exam date change (18 Oct 2026 -> 29 Nov 2026).
#
# It runs championship_date_outreach.py, which reads the recipient list from
# GET /api/admin/championship-date-recipients and then calls
# POST /api/championship-date-notify once per registrant. The endpoint sends to ONE
# registrant per call, so the loop and the delays between sends live here, on the
# runner: a serverless function cannot pace a 95-recipient blast inside its timeout.
#
# DO NOT RUN THIS MORE THAN ONCE. Neither the script nor the endpoint de-duplicates,
# so every run re-sends to every confirmed Season 1 registrant (95 of them). The
# notification_log rows written under purpose 'championship_date_update' are the
# audit trail.
#
# workflow_dispatch only. This is deliberately NEVER scheduled.

on:
  workflow_dispatch: {}

# Never let two runs overlap. Queue rather than cancel so a slow blast finishes.
concurrency:
  group: championship-date-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Validate GV_CRON_SECRET is set
        env:
          GV_CRON_SECRET: ${{ secrets.GV_CRON_SECRET }}
        run: |
          if [ -z "${GV_CRON_SECRET}" ]; then
            echo "FATAL: GV_CRON_SECRET is not set. Add it under Settings > Secrets and variables > Actions before running this workflow."
            exit 1
          fi
          echo "GV_CRON_SECRET is present."

      - name: Send championship date update to all confirmed Season 1 registrants
        run: python championship_date_outreach.py
        env:
          GV_ADMIN_URL:   ${{ secrets.GV_ADMIN_URL }}
          GV_CRON_SECRET: ${{ secrets.GV_CRON_SECRET }}
